<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · SEO Growth Console</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo-mark">SG</div>
    <h1>SEO 增长工作台</h1>
    <p class="muted">仅限管理员访问</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="next" value="{{ next }}">
      <label>用户名<input name="username" required autofocus autocomplete="username"></label>
      <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="primary wide" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
